name: pfe-data-maturity

services:
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: pfe-app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SERVER_PORT: ${BACKEND_PORT:-9090}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/pfe_backend_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-pfe_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-123456}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "false"
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_CONTINUE_ON_ERROR: "true"
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:db/schema-required-singular.sql,classpath:db/schema-jpa-sync.sql,classpath:db/schema-recommendation-target.sql
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-change-this-super-secret-key-at-least-32-characters}
      APP_AUTH_BOOTSTRAP_ENABLED: ${APP_AUTH_BOOTSTRAP_ENABLED:-false}
      APP_AUTH_BOOTSTRAP_ADMIN_EMAIL: ${APP_AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@pfe.local}
      APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD:-Admin@12345}
      APP_AUTH_BOOTSTRAP_ADMIN_FULL_NAME: ${APP_AUTH_BOOTSTRAP_ADMIN_FULL_NAME:-Super Admin}
      APP_QUESTIONNAIRE_SEED_ENABLED: ${APP_QUESTIONNAIRE_SEED_ENABLED:-false}
      APP_DEMO_CLEANUP_ENABLED: ${APP_DEMO_CLEANUP_ENABLED:-false}
      APP_DEMO_SEED_SYNTHETIC: ${APP_DEMO_SEED_SYNTHETIC:-false}
      APP_EVIDENCE_STORAGE_DIR: /app/data/evidence
      APP_AI_RECOMMENDATION_BASE_URL: ${APP_AI_RECOMMENDATION_BASE_URL:-http://127.0.0.1:8002}
      APP_AI_RECOMMENDATION_TIMEOUT_SECONDS: ${APP_AI_RECOMMENDATION_TIMEOUT_SECONDS:-9000}
      ACCEPTANCE_CRITERIA_BASE_URL: ${ACCEPTANCE_CRITERIA_BASE_URL:-http://127.0.0.1:8003}
      APP_AI_ACCEPTANCE_CRITERIA_BASE_URL: ${ACCEPTANCE_CRITERIA_BASE_URL:-http://127.0.0.1:8003}
      ACCEPTANCE_CRITERIA_TIMEOUT_SECONDS: ${ACCEPTANCE_CRITERIA_TIMEOUT_SECONDS:-9000}
      APP_AI_ACCEPTANCE_CRITERIA_TIMEOUT_SECONDS: ${ACCEPTANCE_CRITERIA_TIMEOUT_SECONDS:-9000}
      RECOMMENDATION_PORT: ${RECOMMENDATION_PORT:-8002}
      RECOMMENDATION_OLLAMA_MODEL: ${RECOMMENDATION_OLLAMA_MODEL:-qwen3.5:9b}
      ACCEPTANCE_CRITERIA_PORT: ${ACCEPTANCE_CRITERIA_PORT:-8003}
      ACCEPTANCE_OLLAMA_BASE_URL: ${ACCEPTANCE_OLLAMA_BASE_URL:-http://ollama:11434/v1}
      ACCEPTANCE_OLLAMA_MODEL: ${ACCEPTANCE_OLLAMA_MODEL:-qwen2.5vl:7b}
      ACCEPTANCE_OLLAMA_TIMEOUT_SECONDS: ${ACCEPTANCE_OLLAMA_TIMEOUT_SECONDS:-9000}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-9000}
      USE_OLLAMA: ${USE_OLLAMA:-true}
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://127.0.0.1:9090}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${BACKEND_PORT:-9090}:${BACKEND_PORT:-9090}"
    volumes:
      - backend_evidence:/app/data/evidence
      - pfe_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:$${BACKEND_PORT:-9090}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - pfe-network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: pfe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pfe_backend_db}
      POSTGRES_USER: ${POSTGRES_USER:-pfe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/local-snapshot.sql:/docker-entrypoint-initdb.d/01-local-snapshot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pfe_user} -d ${POSTGRES_DB:-pfe_backend_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pfe-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: pfe-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${OLLAMA_DATA_PATH:-pfe_ollama_data}:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - pfe-network
    restart: unless-stopped

networks:
  pfe-network:
    driver: bridge

volumes:
  postgres_data:
    name: pfe_postgres_data_full
  backend_evidence:
    name: pfe_backend_evidence_data
  pfe_ollama_data:
    name: pfe_ollama_data
