[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
pidfile=/tmp/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
directory=/app

[program:backend]
command=java -jar /app/backend/app.jar --server.port=9090
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
startsecs=15
startretries=5
environment=SERVER_PORT="9090",SPRING_DATASOURCE_URL="jdbc:postgresql://postgres:5432/pfe_backend_db",SPRING_DATASOURCE_USERNAME="pfe_user",SPRING_DATASOURCE_PASSWORD="123456",APP_AUTH_JWT_SECRET="change-this-super-secret-key-at-least-32-characters",APP_AI_RECOMMENDATION_BASE_URL="http://127.0.0.1:8002",APP_AI_RECOMMENDATION_TIMEOUT_SECONDS="9000",ACCEPTANCE_CRITERIA_BASE_URL="http://127.0.0.1:8003",ACCEPTANCE_CRITERIA_TIMEOUT_SECONDS="9000",APP_DEMO_CLEANUP_ENABLED="false",APP_QUESTIONNAIRE_SEED_ENABLED="false"

[program:ai-recommendation]
command=uvicorn app.main:app --host 0.0.0.0 --port 8002
directory=/app/services/recommendation
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
startsecs=10
startretries=5
environment=PYTHONUNBUFFERED="1",OLLAMA_BASE_URL="http://ollama:11434",OLLAMA_MODEL="qwen3.5:9b",USE_OLLAMA="true",OLLAMA_TIMEOUT_SECONDS="9000",OPENAI_TIMEOUT_SECONDS="9000"

[program:evaluate-evidence]
command=uvicorn api_server:app --host 0.0.0.0 --port 8003
directory=/app/services/evaluation
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=35
startsecs=10
startretries=5
environment=PYTHONUNBUFFERED="1",ACCEPTANCE_CRITERIA_PORT="8003",OLLAMA_BASE_URL="http://ollama:11434/v1",OLLAMA_MODEL="qwen2.5vl:7b",OLLAMA_API_KEY="ollama",OLLAMA_TIMEOUT_SECONDS="9000"