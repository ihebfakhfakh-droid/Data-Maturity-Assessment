spring.datasource.url=jdbc:h2:mem:pfe_backend_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

app.auth.jwt.secret=test-secret-key-at-least-32-chars!!
app.auth.jwt.expiration-hours=1

app.ai.recommendation.base-url=http://localhost:8002
app.ai.recommendation.timeout-seconds=30

app.ai.acceptance-criteria.base-url=http://localhost:8003
app.ai.acceptance-criteria.timeout-seconds=30

