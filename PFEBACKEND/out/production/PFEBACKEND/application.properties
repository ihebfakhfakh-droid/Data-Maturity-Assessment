spring.application.name=PFEBACKEND

# Run on a non-conflicting port for local dev.
server.port=9090

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pfe_backend_db
spring.datasource.username=pfe_user
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# IMPORTANT: never let Hibernate create/update/validate PostgreSQL tables automatically.
# The project uses an existing legacy schema, so strict validation would fail on columns
# that are intentionally not present in the old tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run the controlled schema scripts required by the singular legacy schema.
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:db/schema-required-singular.sql,classpath:db/schema-jpa-sync.sql,classpath:db/schema-recommendation-target.sql

# Désactiver H2 console
spring.h2.console.enabled=false

# DevTools: désactive le redémarrage automatique du contexte (souvent confondu avec "il faut redémarrer le serveur").
spring.devtools.restart.enabled=false

# Evidence uploads (stored on local filesystem)
app.evidence.storage-dir=./data/evidence
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT secret must be at least 32 chars for HS256.
app.auth.jwt.secret=change-this-super-secret-key-at-least-32-characters
app.auth.jwt.expiration-hours=8

# Default admin account created at startup if missing.
app.auth.bootstrap.enabled=false
app.auth.bootstrap.admin-email=admin@pfe.local
app.auth.bootstrap.admin-password=Admin@12345
app.auth.bootstrap.admin-full-name=Super Admin

# Existing PostgreSQL database already contains questionnaire data.
# Do not seed/overwrite questions at startup.
app.questionnaire.seed.enabled=false

# Demo users/projects for Docker presentations (see DemoDataSeeder).
app.demo.seed.enabled=false

# AI recommendation microservice (FastAPI).
app.ai.recommendation.base-url=http://localhost:8002
app.ai.recommendation.timeout-seconds=9000

# Acceptance Criteria evaluation microservice (FastAPI, port 8003).
app.ai.acceptance-criteria.base-url=${ACCEPTANCE_CRITERIA_BASE_URL:http://localhost:8003}
app.ai.acceptance-criteria.timeout-seconds=${ACCEPTANCE_CRITERIA_TIMEOUT_SECONDS:9000}
